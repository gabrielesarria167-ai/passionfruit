<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passionfruit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ground: #0a0709; --ink: #f1e6dc; --chip: #1a1317; --line: #3f3238; }
  :root[data-backdrop="pith"] { --ground: #e4d9c8; --ink: #2a0f22; --chip: #efe7dc; --line: #b8a695; }
  :root[data-backdrop="lilac"] { --ground: #cbbdd0; --ink: #2a0f22; --chip: #ddd2e0; --line: #9f8fa4; }
  :root[data-backdrop="aubergine"] { --ground: #140b12; --ink: #f3e7dc; --chip: #24161f; --line: #54394c; }
  html, body { margin: 0; height: 100%; background: var(--ground); }
  body { font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--ink); overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100svh; min-height: 480px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mark { position: absolute; left: 40px; top: 28px; margin: 0; font-family: 'Gloock', Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: 0.005em; }
  .replay { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); color: var(--ink); font: 500 15px/1 'Instrument Sans', system-ui, sans-serif; cursor: pointer; }
  .replay:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .say { position: absolute; left: 24px; right: 24px; bottom: 15%; display: grid; place-items: center; pointer-events: none; }
  .say p { grid-area: 1 / 1; margin: 0; max-width: 18em; text-align: center; font-family: 'Gloock', Georgia, serif; font-size: clamp(22px, 3.1vw, 40px); font-weight: 400; line-height: 1.25; letter-spacing: 0.005em; opacity: 0; transform: translateY(12px); transition: opacity 450ms ease, transform 450ms ease; }
  .say p.is-on { opacity: 0.94; transform: none; }
  @media (prefers-reduced-motion: reduce) { .say p { transition-duration: 1ms; } }
</style>
</head>
<body>
<main class="stage">
  <canvas id="scene" role="img" aria-label="A purple passionfruit falls onto a dark surface and bursts, throwing shards of rind, golden pulp, seeds and juice across the floor."></canvas>
  <h1 class="mark">Passionfruit</h1>
  <div class="say">
    <p data-line="before" class="is-on">We don&rsquo;t have to do it</p>
  </div>
  <button id="replay" class="replay" type="button">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    Drop again
  </button>
</main>
<script>
  document.documentElement.dataset.backdrop = new URLSearchParams(location.search).get('backdrop') || 'night';
</script>
<script type="module" src="dist/main.js"></script>
</body>
</html>
